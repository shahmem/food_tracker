<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Ghazal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    input, select, textarea { font-size: 16px !important; }
    .nav-btn.active { color: #3B82F6; }
    .nav-btn.active svg { stroke: #3B82F6; }
    .modal-overlay { display: none; }
    .modal-overlay.open { display: flex; }
    .slide-up { animation: slideUp 0.2s ease-out; }
    @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    ::-webkit-scrollbar { display: none; }
    #login-screen { display: none; }
    #login-screen.visible { display: flex; }
  </style>
</head>
<body class="bg-gray-50 font-sans">

  <!-- Member picker screen -->
  <div id="login-screen" class="fixed inset-0 z-[70] bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-800 items-center justify-center p-6"></div>

  <!-- Main app -->
  <div class="max-w-lg mx-auto min-h-screen pb-24 relative">
    <div id="app" class="min-h-screen">
      <div class="flex items-center justify-center h-64">
        <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full spin"></div>
      </div>
    </div>

    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-lg bg-white border-t border-gray-100 shadow-lg z-40">
      <div class="flex justify-around">
        <button onclick="navigate('dashboard')" data-page="dashboard" class="nav-btn flex flex-col items-center gap-0.5 py-3 px-4 text-gray-400 flex-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          <span class="text-xs font-medium">Home</span>
        </button>
        <button onclick="navigate('bills')" data-page="bills" class="nav-btn flex flex-col items-center gap-0.5 py-3 px-4 text-gray-400 flex-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          <span class="text-xs font-medium">Bills</span>
        </button>
        <button onclick="navigate('tracking')" data-page="tracking" class="nav-btn flex flex-col items-center gap-0.5 py-3 px-4 text-gray-400 flex-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
          <span class="text-xs font-medium">Tracking</span>
        </button>
        <button onclick="navigate('settle')" data-page="settle" class="nav-btn flex flex-col items-center gap-0.5 py-3 px-4 text-gray-400 flex-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          <span class="text-xs font-medium">Settle</span>
        </button>
        <button onclick="navigate('members')" data-page="members" class="nav-btn flex flex-col items-center gap-0.5 py-3 px-4 text-gray-400 flex-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <span class="text-xs font-medium">People</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay fixed inset-0 bg-black/50 z-50 items-end justify-center">
    <div class="w-full max-w-lg mx-auto">
      <div id="modal-box" class="bg-white rounded-t-3xl max-h-[92vh] overflow-y-auto px-5 pt-5 pb-8"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
