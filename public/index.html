<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Ghazal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    input, select, textarea { font-size: 16px !important; }
    .nav-btn.active { color: #3B82F6; }
    .nav-btn.active svg { stroke: #3B82F6; }
    .modal-overlay { display: none; }
    .modal-overlay.open { display: flex; }
    .slide-up { animation: slideUp 0.2s ease-out; }
    @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .spin { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    ::-webkit-scrollbar { display: none; }
    #login-screen { display: none; }
    #login-screen.visible { display: flex; }
  </style>
</head>
<body class="bg-gray-50 font-sans">

  <!-- Login screen (full-page overlay) -->
  <div id="login-screen" class="fixed inset-0 z-[70] bg-gradient-to-br from-blue-600 via-blue-700 to-indigo-800 items-center justify-center p-6 overflow-y-auto">
    <div class="w-full max-w-sm my-auto py-4">
      <div class="text-center mb-8">
        <h1 class="text-5xl font-black text-white tracking-tight">Ghazal</h1>
        <p class="text-blue-200 mt-2 text-lg font-medium">South 11</p>
      </div>

      <!-- First-time setup (hidden until needed) -->
      <div id="setup-section" class="hidden mb-4">
        <div class="bg-white rounded-3xl p-6 shadow-2xl">
          <h2 class="text-base font-bold text-gray-800 mb-0.5">First-time setup</h2>
          <p class="text-sm text-gray-500 mb-4">Add all room members, then log in.</p>
          <form onsubmit="setupAddMember(event)" class="flex gap-2 mb-3" novalidate>
            <input name="name" type="text" placeholder="Person's name" autocomplete="off"
              class="flex-1 border border-gray-200 rounded-xl px-3 py-2.5 bg-gray-50 text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button type="submit" class="bg-blue-500 text-white px-4 py-2.5 rounded-xl font-semibold text-sm whitespace-nowrap">Add Person</button>
          </form>
          <div id="setup-members-list" class="space-y-1.5"></div>
          <div id="setup-login-hint" class="hidden mt-4 p-3 bg-green-50 border border-green-100 rounded-xl text-sm text-green-700 text-center font-medium">
            All done! Log in below using your name as username.
          </div>
        </div>
      </div>

      <!-- Login form -->
      <div class="bg-white rounded-3xl p-7 shadow-2xl">
        <form id="login-form" class="space-y-4" novalidate>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Username</label>
            <input name="username" type="text" placeholder="yourname" autocomplete="username"
              class="w-full border border-gray-200 rounded-xl px-4 py-3 bg-gray-50 text-base focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Password</label>
            <div class="relative">
              <input name="password" id="pwd-input" type="password" placeholder="yourname@123" autocomplete="current-password"
                class="w-full border border-gray-200 rounded-xl px-4 py-3 bg-gray-50 text-base focus:outline-none focus:ring-2 focus:ring-blue-500 pr-12">
              <button type="button" onclick="togglePwd()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm px-1">👁</button>
            </div>
          </div>
          <div id="login-error" class="text-red-500 text-sm text-center py-1 hidden"></div>
          <button type="submit" id="login-btn" class="w-full bg-blue-500 text-white py-3.5 rounded-xl font-bold text-base shadow-sm">Sign In</button>
        </form>
        <p class="text-center text-xs text-gray-400 mt-5 leading-relaxed">
          Default login:<br>
          <span class="font-mono bg-gray-100 px-1 rounded">yourname</span> / <span class="font-mono bg-gray-100 px-1 rounded">yourname@123</span>
        </p>
      </div>
    </div>
  </div>

  <!-- Main app -->
  <div class="max-w-lg mx-auto min-h-screen pb-24 relative">
    <div id="app" class="min-h-screen">
      <div class="flex items-center justify-center h-64">
        <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full spin"></div>
      </div>
    </div>

    <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-lg bg-white border-t border-gray-100 shadow-lg z-40">
      <div class="flex justify-around">
        <button onclick="navigate('dashboard')" data-page="dashboard" class="nav-btn flex flex-col items-center gap-0.5 py-3 px-4 text-gray-400 flex-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          <span class="text-xs font-medium">Home</span>
        </button>
        <button onclick="navigate('bills')" data-page="bills" class="nav-btn flex flex-col items-center gap-0.5 py-3 px-4 text-gray-400 flex-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          <span class="text-xs font-medium">Bills</span>
        </button>
        <button onclick="navigate('tracking')" data-page="tracking" class="nav-btn flex flex-col items-center gap-0.5 py-3 px-4 text-gray-400 flex-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
          <span class="text-xs font-medium">Tracking</span>
        </button>
        <button onclick="navigate('settle')" data-page="settle" class="nav-btn flex flex-col items-center gap-0.5 py-3 px-4 text-gray-400 flex-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
          <span class="text-xs font-medium">Settle</span>
        </button>
        <button onclick="navigate('members')" data-page="members" class="nav-btn flex flex-col items-center gap-0.5 py-3 px-4 text-gray-400 flex-1">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <span class="text-xs font-medium">People</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="modal-overlay fixed inset-0 bg-black/50 z-50 items-end justify-center">
    <div class="w-full max-w-lg mx-auto">
      <div id="modal-box" class="bg-white rounded-t-3xl max-h-[92vh] overflow-y-auto px-5 pt-5 pb-8"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
